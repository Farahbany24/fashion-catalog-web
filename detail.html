<body>

            <a class="navbar-brand me-auto aboreto-regular" href="index.html">ZALORY</a>

                aria-labelledby="offcanvasNavbarLabel">

                    <h5 class="offcanvas-title" id="offcanvasNavbarLabel">ZALORY</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="navbar-nav justify-content-center flex-grow-1 pe-3">
                        <li class="nav-item dropdown open-sans">
                            <a class="nav-link fs-7 mx-lg-3" href="#" id="navbarDropdown" role="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                MEN
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="Shoescv men.html">Shoes</a></li>
                                <li><a class="dropdown-item" href="ClotheScv men.html">Clothes</a></li>
                            </ul>
                        </li>
                        <li class="nav-item dropdown open-sans">
                            <a class="nav-link fs-7 mx-lg-3" href="#" id="navbarDropdown" role="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                WOMEN
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="Shoescv women.html">Shoes</a></li>
                                <li><a class="dropdown-item" href="Clothescv women.html">Clothes</a></li>
                            </ul>
                        </li>
                        <li class="nav-item dropdown open-sans">
                            <a class="nav-link fs-7 mx-lg-3" href="#" id="navbarDropdown" role="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                KIDS
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="Shoescv kids.html">Shoes</a></li>

                            </ul>
                        </li>
                    </ul>
                </div>
            </div>

            <button class="navbar-toggler navbar" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="left-section">
                <div class="small-image-group">
                    <div class="small-image">
                        <img src="assets/img/cv1.jpg" alt="" onclick="clickme(this)">
                    </div>
                    <div class="small-image">
                        <img src="assets/img/cv2.jpg" alt="" onclick="clickme(this)">
                    </div>
                    <div class="small-image">
                        <img src="assets/img/cv3.jpg" alt="" onclick="clickme(this)">
                    </div>
                    <div class="small-image">
                        <img src="assets/img/cv4.jpg" alt="" onclick="clickme(this)">
                    </div>
                </div>
                <div class="main-image">
                    <img src="assets/img/cv1.jpg" alt="" id="image">
                </div>
            </div>
            <div class="right-section">
                <div class="content">
                    <h5>Converse Men's Shirt</h5>
                    <p style="margin-bottom: 25px;">Men's American style fun pattern short sleeve simple sports round
                        neck T-shirt</p>
                    <p style="font-weight: 600; color: black; margin-bottom: 40px;">Rp 500.000</p>
                    <p style="font-weight: bold; margin-bottom: 10px;">Size Chart</p>
                </div>
                <div class="size">
                    <div class="psize">S</div>
                    <div class="psize">M</div>
                    <div class="psize">L</div>
                    <div class="psize">XL</div>
                    <div class="psize">XXL</div>
                </div>
                <div class="sub-btn" style="margin-top: 60px;">
                    <button class="submit">Get in Touch</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        function clickme(smallImage) {
            const fullImage = document.getElementById("image");
            fullImage.src = smallImage.src;
        }

        const sizes = document.querySelectorAll('.psize');
        sizes.forEach(size => {
            size.addEventListener('click', () => {
                sizes.forEach(s => s.classList.remove('active'));
                size.classList.add('active');
            });
        });

        const submitBtn = document.querySelector('.submit');

        submitBtn.addEventListener('click', () => {
            submitBtn.classList.toggle('active');
        });
    </script>
</body>
